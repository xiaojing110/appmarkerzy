name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Make Gradle Wrapper Executable
        # zip / Windows 等渠道会让 gradlew 丢失可执行位，这里兜底，避免 ./gradlew: Permission denied
        run: chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore ${{ github.workspace }}/keystore.jks \
            -alias appmarket \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storetype JKS \
            -storepass appmarket123 \
            -keypass appmarket123 \
            -dname "CN=AppMarket, OU=Dev, O=AppMarket, L=City, ST=State, C=CN"

      - name: Build Release APK
        run: |
          ./gradlew :app:android:assembleRelease
          echo "APK_FILE=$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)" >> $GITHUB_ENV
        env:
          # 非发版构建给版本名追加 -<7 位提交>（见 buildSrc/AppVersion.kt），发版构建留空
          COMMIT_ID: ${{ !startsWith(github.ref, 'refs/tags/') && github.sha || '' }}
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: appmarket123
          KEY_ALIAS: appmarket
          KEY_PASSWORD: appmarket123

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)")
          fi
          {
            echo "changelog<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build {0}', github.run_number) }}
          body: |
            ## 更新历史

            ${{ steps.changelog.outputs.changelog }}

            ---

            **构建信息**
            - Commit: `${{ github.sha }}`
            - 分支/Tag: `${{ github.ref_name }}`
            - 触发者: @${{ github.actor }}
          files: ${{ env.APK_FILE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display APK Hashes
        run: |
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
